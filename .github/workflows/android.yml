name: Android CI

on:
  push:
    paths:
      - "android/**"
  pull_request:
    paths:
      - "android/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: DeLaGuardo/setup-clojure@12
        with:
          cli: latest
      - name: Install dependencies
        working-directory: android
        run: flutter pub get
      - name: Compile ClojureDart
        working-directory: android
        run: clojure -M:cljd compile pokeapr.main
      - name: Build APK
        working-directory: android
        run: flutter build apk
